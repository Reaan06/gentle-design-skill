name: Design Gate CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  gate-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run design-gate and visual-audit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run static design gate across all example artboards
        run: python3 skill/scripts/design-gate.py examples/*/*.html

      - name: Verify skill copy against sync-manifest
        run: python3 skill/scripts/sync-check.py verify skill skill/sync-manifest.json

      - name: Set up Node.js for DESIGN.md lint
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint DESIGN.md files with Google design.md CLI
        run: |
          for file in examples/*/DESIGN.md; do
            npx -y @google/design.md lint "$file"
          done

      - name: Set up agent-browser for visual audit
        run: |
          npm install -g agent-browser
          agent-browser install --with-deps

      - name: Run visual audit (headless Chromium) over example artboards
        run: python3 skill/scripts/visual-audit.py examples/*/*.html --viewport auto --json
